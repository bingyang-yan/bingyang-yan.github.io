<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travel · Bingyang Yan</title>
  <link rel="stylesheet" href="../assets/navigation.css?v=2">
  <script src="../assets/navigation.js?v=2" defer></script>
  <link rel="stylesheet" href="./travel.css?v=11">
  <script src="./travel.js?v=8" defer></script>
</head>
<body class="has-site-footer">
  <!-- Navigation adapted from breadli428/breadli428.github.io (MIT).
       See ../assets/navigation.LICENSE.txt. -->
  <header class="gnav">
    <nav class="gnav-inner" aria-label="Main">
      <a class="gnav-brand" href="./index.html">Bingyang Yan</a>
      <ul class="gnav-links" id="gnav-links">
        <li><span data-section="travel">Travel</span></li>
        <li><span data-section="movies">Movies</span></li>
        <li><span data-section="karaoke">Karaoke</span></li>
        <li><span data-section="foods">Foods</span></li>
        <li><span data-section="sports">Sports</span></li>
        <li><span data-section="gadgets">Gadgets</span></li>
        <li><span data-section="selfies">Selfies</span></li>
        <li><a href="../index.html">Work</a></li>
      </ul>
      <div class="gnav-tools">
        <button class="icon-btn" type="button" data-search aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/>
          </svg>
        </button>
        <button class="icon-btn gnav-menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="gnav-links">
          <span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
      </div>
    </nav>
  </header>
  <main class="travel" id="travel">
    <div class="travel-heading">
      <h1>Travel</h1>
      <a class="travel-source-link" href="https://bryce-yan.notion.site/db-travel">View source database</a>
    </div>
    <div class="travel-filters">
      <div class="travel-filter-group" id="travel-country" role="group" aria-label="Filter by featured places or country"></div>
      <div class="travel-filter-group" id="travel-city" role="group" aria-label="Filter by city"></div>
      <div class="travel-filter-group" id="travel-year" role="group" aria-label="Filter by year"></div>
    </div>
    <p id="travel-status" role="status">Loading travel records…</p>
    <div class="travel-grid" id="travel-grid"></div>
    <template id="travel-card-template">
      <a class="travel-card" target="_blank" rel="noopener noreferrer">
        <img alt="" decoding="async">
        <span class="travel-card-label"></span>
        <span class="travel-card-details">
          <span class="travel-card-location"><strong></strong><span class="travel-card-country"></span></span>
          <small></small>
        </span>
      </a>
    </template>
  </main>
  <footer class="site-footer">This site is currently under development.</footer>
  <dialog class="search-modal" aria-label="Search">
    <div class="search-field">
      <input type="search" aria-label="Search pages" placeholder="Search pages" autofocus>
      <button class="icon-btn" type="button" data-close aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <ul class="search-results"></ul>
    <div role="status"></div>
  </dialog>
</body>
</html>
