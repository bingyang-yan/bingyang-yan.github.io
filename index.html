<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bingyang Yan</title>
  <link rel="stylesheet" href="assets/navigation.css">
  <script>
    try {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch {
      // Follow the system theme when storage is unavailable.
    }
  </script>
  <script src="assets/navigation.js" defer></script>
</head>
<body>
  <!-- Navigation adapted from breadli428/breadli428.github.io (MIT).
       See assets/navigation.LICENSE.txt. -->
  <header class="gnav">
    <nav class="gnav-inner" aria-label="Main">
      <a class="gnav-brand" href="./">Bingyang Yan</a>
      <ul class="gnav-links" id="gnav-links">
        <li><span data-section="bio">Bio</span></li>
        <li><span data-section="news">News</span></li>
        <li><span data-section="research">Research</span></li>
        <li><span data-section="publications">Publications</span></li>
        <li><span data-section="awards">Awards</span></li>
        <li><span data-section="contact">Contact</span></li>
        <li><a href="life/index.html">Life</a></li>
      </ul>
      <div class="gnav-tools">
        <button class="icon-btn" type="button" data-search aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/>
          </svg>
        </button>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch theme">
          <svg data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
          </svg>
        </button>
        <button class="icon-btn gnav-menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="gnav-links">
          <span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
      </div>
    </nav>
  </header>
  <dialog class="search-modal" aria-label="Search">
    <div class="search-field">
      <input type="search" aria-label="Search pages" placeholder="Search pages" autofocus>
      <button class="icon-btn" type="button" data-close aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <ul class="search-results"></ul>
    <div role="status"></div>
  </dialog>
</body>
</html>
